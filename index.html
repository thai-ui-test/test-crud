<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Inventory Manager</h1>
  <p id="app-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>

  <section aria-labelledby="inventory-form-heading">
    <h2 id="inventory-form-heading">Add an inventory item</h2>
    <form id="inventory-form" novalidate>
      <input type="hidden" id="record-id">
      <label for="name">Name</label><input type="text" id="name" name="name" required>
      <label for="description">Description</label><textarea id="description" name="description" rows="3" required></textarea>
      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="In stock">In stock</option><option value="Low stock">Low stock</option><option value="Out of stock">Out of stock</option>
      </select>
      <div class="form-actions"><button type="submit" id="submit-button">Add item</button><button type="button" id="cancel-button" hidden>Cancel edit</button></div>
    </form>
  </section>

  <section aria-labelledby="inventory-heading">
    <h2 id="inventory-heading">Current inventory</h2>
    <p id="empty-message">No inventory records yet.</p>
    <ul id="inventory-list"></ul>
  </section>

  <section aria-labelledby="employee-form-heading">
    <h2 id="employee-form-heading">Add an employee</h2>
    <form id="employee-form" novalidate>
      <input type="hidden" id="employee-id">
      <label for="employee-name">Name</label><input type="text" id="employee-name" name="employee-name" required>
      <label for="employee-email">Email</label><input type="email" id="employee-email" name="employee-email" required>
      <label for="employee-department">Department (optional)</label>
      <select id="employee-department" name="employee-department"><option value="">No department</option></select>
      <div class="form-actions"><button type="submit" id="employee-submit-button">Add employee</button><button type="button" id="employee-cancel-button" hidden>Cancel edit</button></div>
    </form>
  </section>

  <section aria-labelledby="employees-heading">
    <h2 id="employees-heading">Employees</h2>
    <p id="employees-empty-message">No employee records yet.</p>
    <div class="table-wrapper" id="employees-table-wrapper" hidden>
      <table>
        <thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Department</th><th scope="col">Actions</th></tr></thead>
        <tbody id="employees-table-body"></tbody>
      </table>
    </div>
  </section>

  <section aria-labelledby="department-form-heading">
    <h2 id="department-form-heading">Add a department</h2>
    <form id="department-form" novalidate>
      <input type="hidden" id="department-id">
      <label for="department-name">Name</label><input type="text" id="department-name" name="department-name" required>
      <div class="form-actions"><button type="submit" id="department-submit-button">Add department</button><button type="button" id="department-cancel-button" hidden>Cancel edit</button></div>
    </form>
  </section>

  <section aria-labelledby="departments-heading">
    <h2 id="departments-heading">Departments</h2>
    <p id="departments-empty-message">No department records yet.</p>
    <div class="table-wrapper" id="departments-table-wrapper" hidden>
      <table>
        <thead><tr><th scope="col">Name</th><th scope="col">Employees</th><th scope="col">Actions</th></tr></thead>
        <tbody id="departments-table-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
